<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>icon.no</title>
<style>
/* Reset */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* Tokens */
:root {
  --bg:        #111;
  --bg-2:      #1a1a1a;
  --bg-3:      #151515;
  --bg-4:      #111;
  --border:    #252525;
  --border-2:  #1e1e1e;
  --text:      #ccc;
  --text-dim:  #666;
  --text-faint:#333;
  --green:     #4a8;
  --green-bg:  #0d1e0d;
  --green-border: #1a3a1a;
  --green-btn: #7cb87c;
  --green-btn-border: #3a5a3a;
  --green-btn-bg: #1a261a;
  --orange:    #cc6633;
  --orange-bg: #3a1200;
  --red-dim:   #633;
  --radius:    7px;
  --radius-sm: 4px;
}

/* Base */
body {
  font-family: system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 2rem 1rem;
}

/* Layout */
.app {
  max-width: 680px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 0.8rem;
}

/* App header */
.app-name {
  font-size: 0.7rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  padding: 0.5rem 0;
}

/* Panels */
.panel {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.panel-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.45rem 0.75rem;
  background: var(--bg-3);
  font-size: 0.7rem;
  color: var(--text-dim);
  cursor: pointer;
  user-select: none;
}
.panel-body {
  background: var(--bg-3);
  border-top: 1px solid var(--border-2);
  padding: 0.75rem;
}
.panel.collapsed .panel-body { display: none; }
.panel.collapsed .panel-header { border-bottom: none; }

/* Buttons */
.btn {
  padding: 0.28rem 0.7rem;
  border-radius: var(--radius-sm);
  font-size: 0.71rem;
  border: 1px solid var(--border);
  background: var(--bg-2);
  color: #888;
  cursor: pointer;
  font-family: inherit;
}
.btn:hover { color: var(--text); }
.btn.primary { border-color: var(--green-btn-border); background: var(--green-btn-bg); color: var(--green-btn); }
.btn.primary:hover { filter: brightness(1.1); }
.btn:disabled { opacity: 0.3; cursor: default; pointer-events: none; }

/* Btn row */
.btn-row { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; }

/* Output area */
.output {
  background: var(--bg-4);
  border: 1px solid var(--border-2);
  border-radius: var(--radius-sm);
  padding: 0.6rem 0.7rem;
  font-size: 0.78rem;
  font-family: monospace;
  line-height: 1.8;
  white-space: pre-wrap;
  word-break: break-word;
  min-height: 40px;
}

/* Diff spans */
.del { background: var(--orange-bg); color: var(--orange); border-radius: 3px; padding: 0 2px; text-decoration: line-through; text-decoration-color: #cc4400; }
.keep { background: var(--green-bg); color: var(--green); border-radius: 3px; padding: 0 2px; outline: 1px solid var(--green-border); }

/* Preset list */
#preset-list { display: flex; flex-direction: column; gap: 0.35rem; margin-bottom: 0.5rem; }
.preset-row { border: 1px solid var(--border-2); border-radius: 5px; overflow: hidden; }
.preset-row.on { border-color: #2a3e2a; }
.pr-head { display: flex; align-items: center; gap: 0.5rem; padding: 0.3rem 0.5rem; background: var(--bg-2); font-size: 0.73rem; }
.preset-row.on .pr-head { background: #161e16; }
.pt { width: 26px; height: 14px; border-radius: 7px; border: 1px solid var(--border); background: #222; flex-shrink: 0; cursor: pointer; position: relative; }
.pt.on { background: #2a4a2a; border-color: #3a6a3a; }
.pt.on::after { content:''; position:absolute; right:2px; top:2px; width:8px; height:8px; border-radius:50%; background:var(--green); }
.pt.off::after { content:''; position:absolute; left:2px; top:2px; width:8px; height:8px; border-radius:50%; background:var(--border); }
.pname { color: var(--text-dim); width: 68px; flex-shrink: 0; }
.preset-row.on .pname { color: #999; }
.pemojis { flex:1; font-size:0.88rem; opacity:0.45; }
.preset-row.on .pemojis { opacity:1; }
.pedit { font-size:0.62rem; color:var(--text-faint); cursor:pointer; }
.pedit:hover { color: var(--text-dim); }
.add-preset-btn { font-size:0.7rem; color:var(--text-faint); cursor:pointer; padding:0.25rem 0.5rem; border:1px dashed var(--border-2); border-radius:5px; text-align:center; margin-top:0.3rem; }
.add-preset-btn:hover { color: var(--text-dim); border-color: var(--border); }
.rules-divider { margin-top: 1rem; padding-top: 0.6rem; border-top: 1px solid var(--border, #333); font-size: 0.75rem; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.05em; }
.rule-invalid { text-decoration: line-through; opacity: 0.6; }
.rule-error { font-size: 0.7rem; color: var(--orange); padding: 0 0.6rem 0.4rem; }

/* Preset editor */
.pr-edit-body { padding:0.6rem 0.6rem; background:#121212; border-top:1px solid var(--border-2); display:flex; flex-direction:column; gap:0.5rem; }
.edit-row { display:flex; align-items:center; gap:0.5rem; font-size:0.7rem; }
.edit-label { color:var(--text-faint); width:52px; flex-shrink:0; }
.mock-input { background:var(--bg-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:0.25rem 0.5rem; font-size:0.72rem; color:var(--text); flex:1; max-width:160px; font-family:inherit; }
.emoji-chips-edit { display:flex; flex-wrap:wrap; gap:0.3rem; min-height:1.5rem; }
.echip { display:inline-flex; align-items:center; gap:0.2rem; padding:0.18rem 0.4rem; border-radius:var(--radius-sm); border:1px solid #2a3a2a; background:#161e16; font-size:0.88rem; }
.echip .x { font-size:0.6rem; color:#3a5a3a; cursor:pointer; line-height:1; }
.echip .x:hover { color:#c66; }
.add-emoji-wrap { display:flex; align-items:center; gap:0.4rem; }
.emoji-input { background:var(--bg-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:0.22rem 0.45rem; font-size:0.88rem; width:52px; text-align:center; color:var(--text); }
.edit-actions { display:flex; gap:0.4rem; align-items:center; }
.delete-btn { margin-left:auto; border-color:#3a1a1a; color:var(--red-dim); }
.delete-btn:hover { color:#c66; border-color:var(--red-dim); }
.new-preset { border:1px dashed var(--border-2); }

/* Input zone */
.input-zone { border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; transition: border-color 0.15s; }
.input-zone.drag-over { border-color: var(--green); }
.input-zone-header { display:flex; justify-content:space-between; align-items:center; padding:0.4rem 0.75rem; background:var(--bg-3); border-bottom:1px solid var(--border-2); font-size:0.68rem; color:var(--text-faint); }
.text-input { display:block; width:100%; background:var(--bg-4); border:none; padding:0.65rem 0.75rem; font-size:0.78rem; font-family:monospace; line-height:1.7; resize:vertical; min-height:80px; color: var(--text); }
.text-input:focus { outline:none; background:#131313; }
.text-input::placeholder { color: #333; }
.input-zone-footer { display:flex; justify-content:flex-end; padding:0.35rem 0.75rem; background:var(--bg-3); border-top:1px solid var(--border-2); }

/* Cards */
#card-stack { display:flex; flex-direction:column; gap:0.5rem; }
.card { border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
.card-header { display:flex; align-items:center; gap:0.45rem; padding:0.38rem 0.75rem; background:#161616; font-size:0.72rem; cursor:pointer; user-select:none; }
.card.expanded .card-header { border-bottom:1px solid var(--border-2); }
.card-icon { opacity:0.45; flex-shrink:0; }
.card-name { flex:1; color:#777; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card-status { font-size:0.61rem; padding:0.09rem 0.38rem; border-radius:3px; flex-shrink:0; }
.s-pending { color:var(--text-faint); background:#141414; border:1px solid var(--border-2); }
.s-preview   { color:#886633; background:#1a1500; border:1px solid #332800; }
.s-done     { color:var(--green); background:var(--green-bg); border:1px solid var(--green-border); }
.s-error     { color:var(--orange); background:var(--orange-bg); border:1px solid #5a2200; }
.card-x { font-size:0.65rem; color:var(--text-faint); cursor:pointer; flex-shrink:0; line-height:1; padding:0.1rem 0.15rem; }
.card-x:hover { color:#c66; }
.card-chevron { font-size:0.58rem; color:var(--text-faint); flex-shrink:0; }
.card.collapsed .card-body { display:none; }
.card-body { padding:0.65rem 0.75rem; background:#141414; display:flex; flex-direction:column; gap:0.5rem; }

/* Pending files */
.pending-files-list { display:flex; flex-wrap:wrap; gap:0.35rem; padding:0.45rem 0.75rem; border-top:1px solid var(--border-2); background:var(--bg-4); }
.pf-chip { font-size:0.68rem; color:var(--text-dim); background:var(--bg-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:0.18rem 0.5rem; font-family:monospace; }

/* Bulk bar */
#bulk-bar { display:flex; gap:0.4rem; flex-wrap:wrap; }

/* Scroll-to-top */
#scroll-top {
  position: fixed;
  bottom: 1.5rem;
  right: 1.5rem;
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-dim);
  font-size: 0.7rem;
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
  z-index: 100;
  font-family: inherit;
}
#scroll-top.visible { opacity: 1; pointer-events: auto; }
#scroll-top:hover { color: var(--text); border-color: #444; }
</style>
<script src="engine.js"></script>
<script src="presets.js"></script>
<script src="delete-rules.js"></script>
</head>
<body>
<div class="app">
  <div class="app-name">icon.no</div>
  <div class="panel collapsed" id="config-panel"></div>
  <div id="input-zone"></div>
  <div id="bulk-bar" style="display:none"></div>
  <div id="card-stack"></div>
</div>
<button id="scroll-top" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="Volver arriba">▲</button>
<script>
// ZIP writer
function buildZip(files) {
  const enc = new TextEncoder();
  const parts = [];
  const centralDir = [];
  let offset = 0;

  for (const f of files) {
    const nameBytes = enc.encode(f.name);
    const data = enc.encode(f.content);
    const crc = crc32(data);
    const localHeader = new Uint8Array(30 + nameBytes.length);
    const dv = new DataView(localHeader.buffer);
    dv.setUint32(0, 0x04034b50, true);
    dv.setUint16(4, 20, true);
    dv.setUint16(6, 0, true);
    dv.setUint16(8, 0, true);
    dv.setUint16(10, 0, true);
    dv.setUint16(12, 0, true);
    dv.setUint32(14, crc, true);
    dv.setUint32(18, data.length, true);
    dv.setUint32(22, data.length, true);
    dv.setUint16(26, nameBytes.length, true);
    dv.setUint16(28, 0, true);
    localHeader.set(nameBytes, 30);

    const cdEntry = new Uint8Array(46 + nameBytes.length);
    const cdv = new DataView(cdEntry.buffer);
    cdv.setUint32(0, 0x02014b50, true);
    cdv.setUint16(4, 20, true);
    cdv.setUint16(6, 20, true);
    cdv.setUint16(8, 0, true);
    cdv.setUint16(10, 0, true);
    cdv.setUint16(12, 0, true);
    cdv.setUint16(14, 0, true);
    cdv.setUint32(16, crc, true);
    cdv.setUint32(20, data.length, true);
    cdv.setUint32(24, data.length, true);
    cdv.setUint16(28, nameBytes.length, true);
    cdv.setUint16(30, 0, true);
    cdv.setUint16(32, 0, true);
    cdv.setUint16(34, 0, true);
    cdv.setUint16(36, 0, true);
    cdv.setUint32(38, 0, true);
    cdv.setUint32(42, offset, true);
    cdEntry.set(nameBytes, 46);

    parts.push(localHeader, data);
    centralDir.push(cdEntry);
    offset += localHeader.length + data.length;
  }

  const cdSize = centralDir.reduce((s, e) => s + e.length, 0);
  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(4, 0, true);
  ev.setUint16(6, 0, true);
  ev.setUint16(8, files.length, true);
  ev.setUint16(10, files.length, true);
  ev.setUint32(12, cdSize, true);
  ev.setUint32(16, offset, true);
  ev.setUint16(20, 0, true);

  const all = [...parts, ...centralDir, eocd];
  const total = all.reduce((s, a) => s + a.length, 0);
  const out = new Uint8Array(total);
  let pos = 0;
  for (const a of all) { out.set(a, pos); pos += a.length; }
  return out;
}

function crc32(data) {
  let crc = 0xFFFFFFFF;
  for (const b of data) {
    crc ^= b;
    for (let i = 0; i < 8; i++) crc = (crc >>> 1) ^ (crc & 1 ? 0xEDB88320 : 0);
  }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

// App state
let presets = loadPresets();
let editingPresetId = null;
let cards = [];
let _newPresetEmojis = [];
let _pendingFiles = [];
let deleteRules = loadDeleteRules();
let editingRuleId = null;

// Helpers
function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Config panel
function renderConfig() {
  const panel = document.getElementById('config-panel');
  const isCollapsed = panel.classList.contains('collapsed');
  panel.innerHTML = `
    <div class="panel-header" onclick="toggleConfig()">
      <span>⚙ Preserve emojis</span>
      <span>${isCollapsed ? '▼' : '▲'}</span>
    </div>
    <div class="panel-body">
      <div id="preset-list"></div>
      <div class="add-preset-btn" onclick="startNewPreset()">+ new preset</div>
      <div class="rules-divider">Delete rules</div>
      <div id="rule-list"></div>
      <div class="add-preset-btn" onclick="startNewRule()">+ new rule</div>
    </div>`;
  renderPresetList();
  renderRuleList();
}

function toggleConfig() {
  document.getElementById('config-panel').classList.toggle('collapsed');
  renderConfig();
}

function renderPresetList() {
  const list = document.getElementById('preset-list');
  if (!list) return;
  list.innerHTML = presets.map(p => renderPresetRow(p)).join('');
  if (editingPresetId === '__new__') {
    list.innerHTML += renderNewPresetForm();
  }
}

function renderPresetRow(p) {
  const isEditing = editingPresetId === p.id;
  return `
    <div class="preset-row ${p.enabled ? 'on' : ''}" id="preset-${p.id}">
      <div class="pr-head">
        <div class="pt ${p.enabled ? 'on' : 'off'}" onclick="togglePreset('${p.id}')"></div>
        <span class="pname">${p.name}</span>
        <span class="pemojis">${p.emojis.join(' ')}</span>
        <span class="pedit" onclick="editPreset('${p.id}')">edit</span>
      </div>
      ${isEditing ? renderPresetEditor(p) : ''}
    </div>`;
}

function renderRuleList() {
  const list = document.getElementById('rule-list');
  if (!list) return;
  list.innerHTML = deleteRules.map(r => renderRuleRow(r)).join('');
  if (editingRuleId === '__new__') {
    list.innerHTML += renderNewRuleForm();
  }
}

function renderRuleRow(r) {
  const invalid = r.type === 'regex' && !isRegexValid(r.value);
  const isEditing = editingRuleId === r.id;
  return `
    <div class="preset-row ${r.enabled ? 'on' : ''}" id="rule-${r.id}">
      <div class="pr-head">
        <div class="pt ${r.enabled ? 'on' : 'off'}" onclick="toggleRule('${r.id}')"></div>
        <span class="pname">${escapeHtml(r.type)}</span>
        <span class="pemojis ${invalid ? 'rule-invalid' : ''}">${escapeHtml(r.value)}</span>
        <span class="pedit" onclick="editRule('${r.id}')">edit</span>
      </div>
      ${invalid && !isEditing ? '<div class="rule-error">invalid regex</div>' : ''}
      ${isEditing ? renderRuleEditor(r) : ''}
    </div>`;
}

function renderRuleEditor(r) {
  // value goes into an attribute, so escape double quotes too (escapeHtml only does & < >)
  const attrValue = escapeHtml(r.value).replace(/"/g, '&quot;');
  return `
    <div class="pr-edit-body">
      <div class="edit-row">
        <span class="edit-label">Type</span>
        <select class="mock-input" id="edit-rule-type-${r.id}">
          <option value="literal" ${r.type === 'literal' ? 'selected' : ''}>literal</option>
          <option value="regex" ${r.type === 'regex' ? 'selected' : ''}>regex</option>
        </select>
      </div>
      <div class="edit-row">
        <span class="edit-label">Value</span>
        <input class="mock-input" id="edit-rule-value-${r.id}" value="${attrValue}">
      </div>
      <div class="edit-actions">
        <button class="btn primary" onclick="saveRuleEdit('${r.id}')">Save</button>
        <button class="btn" onclick="cancelRuleEdit()">Cancel</button>
        <button class="btn delete-btn" onclick="deleteRule('${r.id}')">Delete rule</button>
      </div>
    </div>`;
}

function renderNewRuleForm() {
  return `
    <div class="preset-row new-preset">
      <div class="pr-edit-body">
        <div class="edit-row">
          <span class="edit-label">Type</span>
          <select class="mock-input" id="new-rule-type">
            <option value="literal">literal</option>
            <option value="regex">regex</option>
          </select>
        </div>
        <div class="edit-row">
          <span class="edit-label">Value</span>
          <input class="mock-input" id="new-rule-value" placeholder="text or pattern">
        </div>
        <div class="edit-actions">
          <button class="btn primary" onclick="saveNewRule()">Save</button>
          <button class="btn" onclick="cancelRuleEdit()">Cancel</button>
        </div>
      </div>
    </div>`;
}

function togglePreset(id) {
  presets = presets.map(p => p.id === id ? { ...p, enabled: !p.enabled } : p);
  savePresets(presets);
  invalidatePreviewCards();
  renderConfig();
}

function editPreset(id) {
  editingPresetId = editingPresetId === id ? null : id;
  renderConfig();
}

// Preset editor
function renderPresetEditor(p) {
  return `
    <div class="pr-edit-body">
      <div class="edit-row">
        <span class="edit-label">Name</span>
        <input class="mock-input" id="edit-name-${p.id}" value="${p.name}">
      </div>
      <div class="edit-row" style="align-items:flex-start">
        <span class="edit-label" style="padding-top:0.3rem">Emojis</span>
        <div style="flex:1;display:flex;flex-direction:column;gap:0.4rem">
          <div class="emoji-chips-edit">
            ${p.emojis.map(e => `<span class="echip" id="chip-${CSS.escape(e)}-${p.id}">${e}<span class="x" onclick="removeEmojiFromPreset('${p.id}','${e}')">✕</span></span>`).join('')}
          </div>
          <div class="add-emoji-wrap">
            <input class="emoji-input" id="add-emoji-${p.id}" placeholder="🔔" maxlength="8">
            <button class="btn" onclick="addEmojiToPreset('${p.id}')">+ add</button>
          </div>
        </div>
      </div>
      <div class="edit-actions">
        <button class="btn primary" onclick="savePresetEdit('${p.id}')">Save</button>
        <button class="btn" onclick="cancelEdit()">Cancel</button>
        <button class="btn delete-btn" onclick="deletePreset('${p.id}')">Delete preset</button>
      </div>
    </div>`;
}

function renderNewPresetForm() {
  return `
    <div class="preset-row new-preset">
      <div class="pr-edit-body">
        <div class="edit-row">
          <span class="edit-label">Name</span>
          <input class="mock-input" id="new-preset-name" placeholder="My preset">
        </div>
        <div class="edit-row" style="align-items:flex-start">
          <span class="edit-label" style="padding-top:0.3rem">Emojis</span>
          <div style="flex:1;display:flex;flex-direction:column;gap:0.4rem">
            <div class="emoji-chips-edit" id="new-preset-chips">
              ${_newPresetEmojis.length === 0
                ? '<span style="font-size:0.7rem;color:var(--text-faint)">no emojis yet</span>'
                : _newPresetEmojis.map(e => `<span class="echip">${e}<span class="x" onclick="removeNewPresetEmoji('${e}')">✕</span></span>`).join('')}
            </div>
            <div class="add-emoji-wrap">
              <input class="emoji-input" id="add-emoji-__new__" placeholder="🔔" maxlength="8">
              <button class="btn" onclick="addEmojiToPreset('__new__')">+ add</button>
            </div>
          </div>
        </div>
        <div class="edit-actions">
          <button class="btn primary" onclick="saveNewPreset()">Save</button>
          <button class="btn" onclick="cancelEdit()">Cancel</button>
        </div>
      </div>
    </div>`;
}

function startNewPreset() {
  editingPresetId = '__new__';
  _newPresetEmojis = [];
  renderConfig();
  setTimeout(() => document.getElementById('new-preset-name')?.focus(), 0);
}

function cancelEdit() {
  editingPresetId = null;
  _newPresetEmojis = [];
  renderConfig();
}

function startNewRule() {
  editingRuleId = '__new__';
  renderConfig();
  setTimeout(() => document.getElementById('new-rule-value')?.focus(), 0);
}

function cancelRuleEdit() {
  editingRuleId = null;
  renderConfig();
}

function saveNewRule() {
  const typeEl = document.getElementById('new-rule-type');
  const valueEl = document.getElementById('new-rule-value');
  const value = valueEl?.value ?? '';
  if (!value) {
    if (valueEl) { valueEl.style.outline = '1px solid var(--orange)'; setTimeout(() => { valueEl.style.outline = ''; }, 600); }
    return;
  }
  deleteRules = [...deleteRules, makeRule(typeEl?.value === 'regex' ? 'regex' : 'literal', value)];
  saveDeleteRules(deleteRules);
  editingRuleId = null;
  invalidatePreviewCards();
  renderConfig();
}

function toggleRule(id) {
  deleteRules = deleteRules.map(r => r.id === id ? { ...r, enabled: !r.enabled } : r);
  saveDeleteRules(deleteRules);
  invalidatePreviewCards();
  renderConfig();
}

function deleteRule(id) {
  deleteRules = deleteRules.filter(r => r.id !== id);
  saveDeleteRules(deleteRules);
  editingRuleId = null;
  invalidatePreviewCards();
  renderConfig();
}

function editRule(id) {
  editingRuleId = editingRuleId === id ? null : id;
  renderConfig();
}

function saveRuleEdit(id) {
  const typeEl = document.getElementById(`edit-rule-type-${id}`);
  const valueEl = document.getElementById(`edit-rule-value-${id}`);
  const value = valueEl?.value ?? '';
  if (!value) {
    if (valueEl) { valueEl.style.outline = '1px solid var(--orange)'; setTimeout(() => { valueEl.style.outline = ''; }, 600); }
    return;
  }
  const type = typeEl?.value === 'regex' ? 'regex' : 'literal';
  deleteRules = deleteRules.map(r => r.id === id ? { ...r, type, value } : r);
  saveDeleteRules(deleteRules);
  editingRuleId = null;
  invalidatePreviewCards();
  renderConfig();
}

function savePresetEdit(id) {
  const nameEl = document.getElementById(`edit-name-${id}`);
  const inputName = nameEl?.value?.trim();
  const fallback = presets.find(p => p.id === id)?.name ?? id;
  const name = inputName || fallback;
  presets = presets.map(p => p.id === id ? { ...p, name } : p);
  savePresets(presets);
  editingPresetId = null;
  invalidatePreviewCards();
  renderConfig();
}

function saveNewPreset() {
  const nameEl = document.getElementById('new-preset-name');
  const name = nameEl?.value?.trim();
  if (!name) {
    if (nameEl) { nameEl.style.outline = '1px solid var(--orange)'; setTimeout(() => { nameEl.style.outline = ''; }, 600); }
    return;
  }
  const id = 'custom-' + Date.now();
  presets = [...presets, { id, name, emojis: [..._newPresetEmojis], enabled: true }];
  savePresets(presets);
  editingPresetId = null;
  _newPresetEmojis = [];
  invalidatePreviewCards();
  renderConfig();
}

function deletePreset(id) {
  presets = presets.filter(p => p.id !== id);
  savePresets(presets);
  editingPresetId = null;
  invalidatePreviewCards();
  renderConfig();
}

function addEmojiToPreset(id) {
  const input = document.getElementById(`add-emoji-${id}`);
  const emoji = input?.value.trim();
  if (!emoji) return;
  input.value = '';

  if (id === '__new__') {
    if (_newPresetEmojis.includes(emoji)) {
      const container = document.getElementById('new-preset-chips');
      const chips = container?.querySelectorAll('.echip');
      chips?.forEach(chip => { if (chip.textContent.startsWith(emoji)) flashDuplicate(chip); });
      return;
    }
    _newPresetEmojis.push(emoji);
    renderConfig();
    return;
  }

  const preset = presets.find(p => p.id === id);
  if (!preset) return;
  if (preset.emojis.includes(emoji)) { flashDuplicate(document.getElementById(`chip-${CSS.escape(emoji)}-${id}`)); return; }
  presets = presets.map(p => p.id === id ? { ...p, emojis: [...p.emojis, emoji] } : p);
  savePresets(presets);
  invalidatePreviewCards();
  renderConfig();
}

function removeEmojiFromPreset(id, emoji) {
  presets = presets.map(p => p.id === id ? { ...p, emojis: p.emojis.filter(e => e !== emoji) } : p);
  savePresets(presets);
  invalidatePreviewCards();
  renderConfig();
}

function removeNewPresetEmoji(emoji) {
  _newPresetEmojis = _newPresetEmojis.filter(e => e !== emoji);
  renderConfig();
}

function flashDuplicate(el) {
  if (!el) return;
  el.style.outline = '1px solid var(--orange)';
  setTimeout(() => { el.style.outline = ''; }, 400);
}

// Input zone
function renderInputZone() {
  const zone = document.getElementById('input-zone');
  zone.innerHTML = `
    <div class="input-zone" id="drop-zone">
      <div class="input-zone-header">
        <span>Paste text or drop files here</span>
        <label class="btn" style="cursor:pointer">
          + files
          <input type="file" multiple accept=".txt,.md,.js,.py,.json,.csv,.log,.html,.css,.xml,.yaml,text/*" style="display:none" id="file-input">
        </label>
      </div>
      <textarea id="text-input" class="text-input" placeholder="Paste here..."></textarea>
      <div id="pending-files"></div>
      <div class="input-zone-footer">
        <button class="btn primary" id="add-btn" onclick="handleAdd()" disabled>Add →</button>
      </div>
    </div>`;

  const ta = document.getElementById('text-input');
  const btn = document.getElementById('add-btn');
  ta.addEventListener('input', () => { btn.disabled = ta.value.trim() === '' && _pendingFiles.length === 0; });

  document.getElementById('file-input').addEventListener('change', (e) => {
    _pendingFiles = Array.from(e.target.files);
    btn.disabled = _pendingFiles.length === 0 && document.getElementById('text-input').value.trim() === '';
    renderPendingFiles();
  });

  const dropZone = document.getElementById('drop-zone');
  document.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  document.addEventListener('dragleave', (e) => { if (!e.relatedTarget) dropZone.classList.remove('drag-over'); });
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    e.stopPropagation();
    dropZone.classList.remove('drag-over');
    const dropped = Array.from(e.dataTransfer.files);
    for (const file of dropped) {
      addCard({ type: 'file', id: 'card-' + Date.now() + '-' + file.name, name: file.name, file, content: null, state: 'pending' });
    }
  });

  window.addEventListener('blur', () => {
    document.getElementById('drop-zone')?.classList.remove('drag-over');
  });
}

function renderPendingFiles() {
  const el = document.getElementById('pending-files');
  if (!el) return;
  if (_pendingFiles.length === 0) { el.innerHTML = ''; return; }
  el.innerHTML = `<div class="pending-files-list">${_pendingFiles.map(f =>
    `<span class="pf-chip">≡ ${escapeHtml(f.name)}</span>`
  ).join('')}</div>`;
}

function handleAdd() {
  const ta = document.getElementById('text-input');
  const text = ta.value;

  if (text.trim()) {
    const now = new Date();
    const base = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    const exists = cards.some(c => c.name.startsWith(`Text · ${base}`));
    const ts = exists ? `${base}:${String(now.getSeconds()).padStart(2,'0')}` : base;
    addCard({ type: 'text', id: 'card-' + Date.now(), name: `Text · ${ts}`, content: text, state: 'pending' });
    ta.value = '';
  }

  for (const file of _pendingFiles) {
    addCard({ type: 'file', id: 'card-' + Date.now() + '-' + file.name, name: file.name, file, content: null, state: 'pending' });
  }
  _pendingFiles = [];
  document.getElementById('add-btn').disabled = true;
  document.getElementById('file-input').value = '';
  renderPendingFiles();
}

// Cards
function addCard(card) {
  cards.push(card);
  renderCards();
  renderBulkBar();
}

function renderCards() {
  const stack = document.getElementById('card-stack');
  stack.innerHTML = cards.map(renderCard).join('');
}

function renderCard(card) {
  const isCollapsed = card.collapsed ?? false;
  return `
    <div class="card ${isCollapsed ? 'collapsed' : 'expanded'}" id="${card.id}">
      <div class="card-header" onclick="toggleCard('${card.id}')">
        <span class="card-icon">${card.type === 'text' ? '¶' : '≡'}</span>
        <span class="card-name">${card.name}</span>
        <span class="card-status s-${card.state}">${statusLabel(card.state)}</span>
        <span class="card-x" onclick="deleteCard(event,'${card.id}')">✕</span>
        <span class="card-chevron">${isCollapsed ? '▼' : '▲'}</span>
      </div>
      <div class="card-body">
        ${renderCardBody(card)}
      </div>
    </div>`;
}

function statusLabel(state) {
  return { pending: 'pending', preview: 'preview', done: 'done', error: 'error' }[state] ?? state;
}

function renderCardBody(card) {
  if (card.state === 'error') {
    return `<div class="output" style="color:var(--red-dim)">${card.errorMsg ?? 'unsupported file'}</div>`;
  }
  const showDownload = card.type === 'file' && card.state === 'done';
  const showCopy    = card.state === 'done';
  const previewClass = card.state === 'preview' ? 'btn' : 'btn primary';
  const limpiarClass = card.state === 'preview' ? 'btn primary' : 'btn';
  return `
    <div class="btn-row">
      <button class="${previewClass}" onclick="previewCard('${card.id}')">Preview</button>
      <button class="${limpiarClass}" onclick="cleanCard('${card.id}')">Clean</button>
      ${showCopy    ? `<button class="btn" id="copy-btn-${card.id}" onclick="copyCard('${card.id}')">Copy</button>` : ''}
      ${showDownload ? `<button class="btn" onclick="downloadCard('${card.id}')">⬇ Download</button>` : ''}
      ${!showCopy && !showDownload ? `<button class="btn" disabled>${card.type === 'text' ? 'Copy' : '⬇ Download'}</button>` : ''}
    </div>
    <div class="output" id="output-${card.id}">${renderOutput(card)}</div>`;
}

function renderOutput(card) {
  if (!card.segments && !card.cleanContent) return '<span style="color:var(--text-faint)">— unprocessed —</span>';
  if (card.state === 'done') return escapeHtml(card.cleanContent ?? '');
  if (card.state === 'preview') {
    return (card.segments ?? []).map(s => {
      if (s.type === 'plain') return escapeHtml(s.text);
      if (s.type === 'keep') return `<span class="keep">${escapeHtml(s.text)}</span>`;
      return `<span class="del">${escapeHtml(s.text)}</span>`;
    }).join('');
  }
  return '';
}

function toggleCard(id) {
  cards = cards.map(c => c.id === id ? { ...c, collapsed: !(c.collapsed ?? false) } : c);
  renderCards();
}

function deleteCard(e, id) {
  e.stopPropagation();
  cards = cards.filter(c => c.id !== id);
  renderCards();
  renderBulkBar();
}

// Card cycle — text
function previewCard(id) {
  const card = cards.find(c => c.id === id);
  if (!card || card.state === 'error') return;

  if (card.type === 'file' && card.content === null) {
    readFileCard(id, (text) => {
      const { segments, cleanContent } = analyze(text, buildPreserveSet(presets), deleteRules);
      cards = cards.map(c => c.id === id ? { ...c, state: 'preview', segments, cleanContent } : c);
      renderCards();
    });
    return;
  }

  const text = card.content ?? '';
  const { segments, cleanContent } = analyze(text, buildPreserveSet(presets), deleteRules);
  cards = cards.map(c => c.id === id
    ? { ...c, state: 'preview', segments, cleanContent }
    : c);
  renderCards();
}

function cleanCard(id) {
  const card = cards.find(c => c.id === id);
  if (!card || card.state === 'error') return;

  if (card.type === 'file' && card.content === null) {
    readFileCard(id, (text) => {
      const { cleanContent } = analyze(text, buildPreserveSet(presets), deleteRules);
      cards = cards.map(c => c.id === id ? { ...c, content: text, cleanContent, state: 'done', segments: null } : c);
      renderCards();
      renderBulkBar();
    });
    return;
  }

  const text = card.content ?? '';
  const { cleanContent } = analyze(text, buildPreserveSet(presets), deleteRules);
  cards = cards.map(c => c.id === id ? { ...c, cleanContent, state: 'done', segments: null } : c);
  renderCards();
  renderBulkBar();
}

function copyCard(id) {
  const card = cards.find(c => c.id === id);
  if (!card || !card.cleanContent) return;
  navigator.clipboard.writeText(card.cleanContent).then(() => {
    const btn = document.getElementById(`copy-btn-${id}`);
    if (!btn) return;
    btn.textContent = 'Copied ✓';
    setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
  });
}

function invalidatePreviewCards() {
  cards = cards.map(c => c.state === 'preview' ? { ...c, state: 'pending', segments: null, cleanContent: null } : c);
  renderCards();
}

// Card cycle — file
const ACCEPTED_EXTENSIONS = new Set(['.txt','.md','.js','.py','.json','.csv','.log','.html','.css','.xml','.yaml']);

function isAcceptedFile(filename) {
  const ext = filename.slice(filename.lastIndexOf('.')).toLowerCase();
  return ACCEPTED_EXTENSIONS.has(ext);
}

function readFileCard(id, callback) {
  const card = cards.find(c => c.id === id);
  if (!card || !card.file) return;

  if (!isAcceptedFile(card.file.name)) {
    cards = cards.map(c => c.id === id ? { ...c, state: 'error', errorMsg: 'unsupported file' } : c);
    renderCards();
    return;
  }

  const reader = new FileReader();
  reader.onload = (e) => {
    const text = e.target.result;
    cards = cards.map(c => c.id === id ? { ...c, content: text } : c);
    callback(text);
  };
  reader.onerror = () => {
    cards = cards.map(c => c.id === id ? { ...c, state: 'error', errorMsg: 'error reading file' } : c);
    renderCards();
  };
  reader.readAsText(card.file, 'utf-8');
}

function downloadCard(id) {
  const card = cards.find(c => c.id === id);
  if (!card || !card.cleanContent) return;
  const blob = new Blob([card.cleanContent], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = card.name;
  a.click();
  URL.revokeObjectURL(url);
}

// Bulk bar
function renderBulkBar() {
  const bar = document.getElementById('bulk-bar');
  if (cards.length === 0) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  bar.innerHTML = `
    <button class="btn" onclick="previewAll()">◉ Preview all</button>
    <button class="btn primary" onclick="processAll()">▶ Process all</button>
    <button class="btn" onclick="downloadReady()">⬇ Download ready (.zip)</button>`;
}

function previewAll() {
  const previewable = cards.filter(c => c.state === 'pending' || c.state === 'done');
  for (const card of previewable) previewCard(card.id);
}

function processAll() {
  const toProcess = cards.filter(c => c.state === 'pending' || c.state === 'preview');
  for (const card of toProcess) cleanCard(card.id);
}

function downloadReady() {
  const ready = cards.filter(c => c.type === 'file' && c.state === 'done' && c.cleanContent);
  if (ready.length === 0) return;

  if (ready.length === 1) {
    downloadCard(ready[0].id);
    return;
  }

  const today = new Date();
  const dateStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  const files = ready.map(c => ({ name: c.name, content: c.cleanContent }));
  const zipBytes = buildZip(files);
  const blob = new Blob([zipBytes], { type: 'application/zip' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `emoji-cleaner-${dateStr}.zip`;
  a.click();
  URL.revokeObjectURL(url);
}

// Init
renderConfig();
renderInputZone();
window.addEventListener('scroll', () => {
  document.getElementById('scroll-top').classList.toggle('visible', window.scrollY > 200);
});
</script>
</body>
